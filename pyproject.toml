[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enzo-orchestrator"
version = "0.1.0"
description = "Enzo state-driven artifact orchestration V0"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/preservedrdeveloper/enzo-orchestrator"
Issues = "https://github.com/preservedrdeveloper/enzo-orchestrator/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
enzo = "enzo.web:main"
enzo-worker = "enzo.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enzo = ["review_ui/*.html", "review_ui/*.css", "review_ui/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
